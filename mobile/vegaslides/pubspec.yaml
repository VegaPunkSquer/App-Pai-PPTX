name: vegaslides
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  
  # O trio de ferro do VegaSlides Mobile
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - vega_manifesto.json
    - assets/

# ==========================================
# CONFIGURAÇÃO DE ÍCONE E SPLASH SCREEN
# ==========================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icone.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#121212" 
  image: "assets/splash.png"
  android_12:
    image: "assets/splash.png"
    icon_background_color: "#121212"
    color: "#121212"